name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome CI
        run: pnpm exec biome ci

      # The documentation is a declaration layer, and nothing was checking it.
      # Needs no build: the contract reports which evidence tier it used, and
      # falls back to reading the tool definitions from source when the desktop
      # binary is not present.
      - name: Documentation contract
        run: pnpm docs:verify --verbose

      - name: Agent instructions contract
        run: pnpm agents:verify:all
